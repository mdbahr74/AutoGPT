<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crypto Order-Flow Terminal</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <header class="app-header">
      <section>
        <p class="eyebrow">Local order-flow workstation</p>
        <h1>Crypto Order-Flow Terminal</h1>
      </section>
      <section class="layout-controls" aria-label="Chart layout controls">
        <span>Charts</span>
        <button data-layout="1">1</button>
        <button data-layout="2">2</button>
        <button data-layout="4" class="active">4</button>
        <button data-layout="6">6</button>
        <button data-layout="8">8</button>
      </section>
      <section class="status-strip" id="statusStrip">
        <span class="status live">Binance</span>
      </section>
    </header>

    <main>
      <section id="chartGrid" class="chart-grid layout-4" aria-live="polite"></section>
    </main>

    <template id="paneTemplate">
      <article class="chart-pane">
        <div class="pane-toolbar">
          <input class="symbol-input" aria-label="Symbol" placeholder="BTC" />
          <select class="timeframe-select" aria-label="Timeframe">
            <option value="1m">1m</option>
            <option value="5m">5m</option>
            <option value="15m" selected>15m</option>
            <option value="30m">30m</option>
            <option value="1h">1h</option>
            <option value="4h">4h</option>
            <option value="1d">1D</option>
            <option value="1w">1W</option>
            <option value="1M">1M</option>
          </select>
          <details class="indicator-menu">
            <summary>Studies</summary>
            <div class="indicator-group">Volume Profile</div>
            <label><input type="checkbox" value="vrvp" checked /> VRVP (visible range)</label>
            <label><input type="checkbox" value="daily" /> Fixed daily profiles</label>
            <div class="indicator-group">Overlays</div>
            <label><input type="checkbox" value="vwap" checked /> Session VWAP</label>
            <label><input type="checkbox" value="ma" /> Moving averages (20 / 50)</label>
            <label><input type="checkbox" value="orderblocks" /> Order blocks</label>
            <div class="indicator-group">Order flow</div>
            <label><input type="checkbox" value="cvd" checked /> Cumulative delta</label>
            <label><input type="checkbox" value="volume" /> Volume (buy/sell)</label>
          </details>
        </div>
        <div class="pane-meta">
          <strong class="pane-title"></strong>
          <span class="last-price"></span>
          <span class="pane-stats"></span>
          <span class="data-source"></span>
        </div>
        <div class="chart-stack">
          <div class="chart-area price">
            <canvas class="profile-canvas"></canvas>
          </div>
          <div class="chart-area cvd"></div>
        </div>
        <div class="pane-error" hidden></div>
      </article>
    </template>

    <script src="/static/app.js"></script>
  </body>
</html>
